name: Deploy Frontend (React) to AWS EC2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy-frontend:
    name: Deploy Frontend SPA to Dedicated EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Production SPA
        run: |
          npm install
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Init
        working-directory: ./infra/terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: ./infra/terraform
        env:
          TF_VAR_backend_host: ${{ secrets.BACKEND_HOST || '18.206.194.254' }}
        run: terraform apply -replace="aws_instance.elegance_frontend_ec2" -auto-approve || terraform apply -auto-approve

      - name: Get Frontend EC2 connection data from Terraform outputs
        working-directory: ./infra/terraform
        run: |
          echo "FRONTEND_HOST=$(terraform output -raw frontend_public_ip)" >> $GITHUB_ENV
          terraform output -raw frontend_private_key_pem > /tmp/key.pem
          chmod 600 /tmp/key.pem

      - name: Wait for Frontend EC2 Nginx to be ready
        run: |
          echo "⏳ Esperando inicialización de la instancia EC2 Frontend (${{ env.FRONTEND_HOST }})..."
          for i in $(seq 1 30); do
            STATUS=$(ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i /tmp/key.pem ec2-user@${{ env.FRONTEND_HOST }} \
              'cat /var/www/status.txt 2>/dev/null || echo "CONNECTING"' 2>/dev/null || echo "NO_SSH")

            if [ "$STATUS" = "READY" ]; then
              echo "✅ EC2 Frontend lista y aprovisionada con Nginx ($i/30)."
              exit 0
            fi

            echo "[$i/30] Esperando Nginx y status.txt..."
            sleep 10
          done
          echo "❌ La instancia Frontend no terminó de prepararse en el tiempo esperado"
          exit 1

      - name: Deploy Frontend Built Dist to EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/key.pem ec2-user@${{ env.FRONTEND_HOST }} \
            'sudo mkdir -p /var/www/salon-belleza && sudo chown -R ec2-user:ec2-user /var/www/salon-belleza && rm -rf /var/www/salon-belleza/*'
          scp -o StrictHostKeyChecking=no -i /tmp/key.pem -r dist/* ec2-user@${{ env.FRONTEND_HOST }}:/var/www/salon-belleza/
          ssh -o StrictHostKeyChecking=no -i /tmp/key.pem ec2-user@${{ env.FRONTEND_HOST }} \
            'sudo systemctl reload nginx || sudo systemctl restart nginx'

      - name: Output Success Summary
        run: |
          echo "🎉 Frontend React desplegado exitosamente!"
          echo "URL del Frontend: http://${{ env.FRONTEND_HOST }}/"
