name: Deploy Frontend (React) to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install

      - name: Build Production Web App
        run: pnpm build

      - name: Prepare staging directory via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/frontend-dist
            rm -rf /home/ubuntu/frontend-dist/*

      - name: Deploy dist to EC2 home folder via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          source: "dist/*"
          target: "/home/ubuntu/frontend-dist"
          strip_components: 1
          rm: false


      - name: Deploy to Nginx web root & setup Nginx via SSH with sudo
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            # Install Nginx if not installed
            which nginx || (sudo apt-get update -y && sudo apt-get install -y nginx)
            
            # Configure web root
            sudo mkdir -p /var/www/salon-belleza
            sudo rm -rf /var/www/salon-belleza/*
            sudo cp -r /home/ubuntu/frontend-dist/* /var/www/salon-belleza/
            sudo chown -R www-data:www-data /var/www/salon-belleza
            sudo chmod -R 755 /var/www/salon-belleza

            # Configure Nginx site
            sudo tee /etc/nginx/sites-available/salon-belleza > /dev/null << 'EOF'
            server {
                listen 80 default_server;

                server_name _;


                root /var/www/salon-belleza;
                index index.html;

                location / {
                    try_files $uri $uri/ /index.html;
                }

                location /api/v1/ {
                    proxy_pass http://127.0.0.1:8080/api/v1/;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_cache_bypass $http_upgrade;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

            }
            EOF


            # Enable site, disable default, unblock ufw, and restart Nginx
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo ln -sf /etc/nginx/sites-available/salon-belleza /etc/nginx/sites-enabled/
            sudo ufw disable || true
            sudo iptables -F || true
            sudo systemctl enable nginx
            sudo systemctl restart nginx
            
            echo "=== DIAGNOSTICS ==="
            echo "--- 1. Nginx Status ---"
            sudo systemctl status nginx --no-pager || true
            echo "--- 2. Ports Listening ---"
            sudo ss -tulpn || true
            echo "--- 3. Localhost HTTP Check ---"
            curl -I http://localhost || echo "Localhost curl failed!"
            echo "--- 4. Public IP of EC2 ---"
            curl -s http://checkip.amazonaws.com || true





