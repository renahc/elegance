name: Deploy Frontend (React) to AWS EC2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy-frontend:
    name: Deploy Frontend SPA to Dedicated EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Production SPA
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Init
        working-directory: ./infra/terraform
        run: terraform init

      - name: Terminate Any Existing Frontend EC2 Instances in AWS (Prevent Instance Creep)
        run: |
          echo "🔍 Buscando instancias EC2 frontend activas..."
          EXISTING_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=elegance-frontend-ec2,elegance-frontend-*" "Name=instance-state-name,Values=running,pending,stopped" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text)

          if [ -n "$EXISTING_IDS" ]; then
            echo "🗑️ Destruyendo instancias previas del Frontend en AWS: $EXISTING_IDS"
            aws ec2 terminate-instances --instance-ids $EXISTING_IDS
            echo "⏳ Esperando terminación..."
            aws ec2 wait instance-terminated --instance-ids $EXISTING_IDS
            echo "✅ Instancias previas del Frontend destruidas."
          else
            echo "ℹ️ No se encontraron instancias previas del Frontend."
          fi

      - name: Terraform Apply (Create New Fresh EC2 Instance)
        working-directory: ./infra/terraform
        env:
          TF_VAR_backend_host: '3.238.123.188'
        run: terraform apply -auto-approve

      - name: Get Frontend EC2 connection data from Terraform outputs
        working-directory: ./infra/terraform
        run: |
          echo "FRONTEND_HOST=$(terraform output -raw frontend_public_ip)" >> $GITHUB_ENV
          terraform output -raw frontend_private_key_pem > /tmp/key.pem
          chmod 600 /tmp/key.pem

      - name: Wait for SSH Connection to Frontend EC2
        run: |
          echo "⏳ Esperando disponibilidad de SSH en EC2 Frontend (${{ env.FRONTEND_HOST }})..."
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i /tmp/key.pem ec2-user@${{ env.FRONTEND_HOST }} 'echo SSH_OK' 2>/dev/null | grep -q 'SSH_OK'; then
              echo "✅ Conexión SSH establecida con éxito ($i/30)."
              exit 0
            fi
            echo "[$i/30] Esperando inicio del servicio SSH..."
            sleep 5
          done
          echo "❌ No se pudo establecer conexión SSH con la instancia EC2"
          exit 1

      - name: Install & Configure Nginx Reverse Proxy via SSH
        env:
          RAW_BACKEND_HOST: ${{ secrets.BACKEND_HOST || '3.238.123.188' }}
        run: |
          RAW_HOST="${RAW_BACKEND_HOST}"
          CLEAN_HOST=$(echo "${RAW_HOST}" | sed -e 's|^https*://||' -e 's|/.*$||' -e 's|:.*$||' | tr -d '[:space:]')
          if [[ -z "$CLEAN_HOST" || ! "$CLEAN_HOST" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "⚠️ BACKEND_HOST no es una IP válida. Usando IP por defecto: 3.238.123.188"
            CLEAN_HOST="3.238.123.188"
          fi

          echo "⚙️ Configurando Nginx para IP Backend procesada: ${CLEAN_HOST}"
          sed "s/BACKEND_HOST_PLACEHOLDER/${CLEAN_HOST}/g" infra/nginx/salon.conf.template > /tmp/salon.conf

          echo "🚀 Instalando Nginx en EC2 Frontend..."
          ssh -o StrictHostKeyChecking=no -i /tmp/key.pem ec2-user@${{ env.FRONTEND_HOST }} \
            'sudo amazon-linux-extras install -y nginx1 || sudo yum install -y nginx'

          echo "📦 Copiando configuración de Nginx a la instancia EC2..."
          scp -o StrictHostKeyChecking=no -i /tmp/key.pem /tmp/salon.conf ec2-user@${{ env.FRONTEND_HOST }}:/tmp/salon.conf

          ssh -o StrictHostKeyChecking=no -i /tmp/key.pem ec2-user@${{ env.FRONTEND_HOST }} "
            sudo mkdir -p /etc/ssl/certs /etc/ssl/private
            if [ ! -f /etc/ssl/certs/salon-selfsigned.crt ]; then
              sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                -keyout /etc/ssl/private/salon-selfsigned.key \
                -out /etc/ssl/certs/salon-selfsigned.crt \
                -subj '/CN=salon-belleza'
            fi
            sudo mv /tmp/salon.conf /etc/nginx/conf.d/salon.conf
            sudo sed -i 's/default_server//g' /etc/nginx/nginx.conf 2>/dev/null || true
            sudo rm -f /etc/nginx/conf.d/default.conf
            sudo systemctl enable nginx
            sudo nginx -t
            sudo systemctl restart nginx
          "

      - name: Deploy Frontend Built SPA Dist to EC2
        run: |
          echo "📂 Preparando directorio /var/www/salon-belleza..."
          ssh -o StrictHostKeyChecking=no -i /tmp/key.pem ec2-user@${{ env.FRONTEND_HOST }} \
            'sudo mkdir -p /var/www/salon-belleza && sudo chown -R ec2-user:ec2-user /var/www/salon-belleza && sudo rm -rf /var/www/salon-belleza/*'

          echo "🚀 Transfiriendo dist/* a la instancia..."
          scp -o StrictHostKeyChecking=no -i /tmp/key.pem -r dist/* ec2-user@${{ env.FRONTEND_HOST }}:/var/www/salon-belleza/

          echo "🔄 Recargando Nginx..."
          ssh -o StrictHostKeyChecking=no -i /tmp/key.pem ec2-user@${{ env.FRONTEND_HOST }} \
            'sudo systemctl reload nginx || sudo systemctl restart nginx'

      - name: Output Success Summary
        run: |
          echo "🎉 Frontend React desplegado exitosamente!"
          echo "URL del Frontend: http://${{ env.FRONTEND_HOST }}/"
