name: Recreate and Deploy Frontend Infrastructure

on:
  push:
    branches:
      - feat/ep3-kafka-streaming-20261106
  workflow_dispatch:

concurrency:
  group: elegance-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy-frontend:
    name: Recreate frontend EC2 and deploy SPA
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate deployment scripts
        run: |
          bash -n infra/terraform/scripts/cleanup-project-resources.sh
          bash -n scripts/setup-ec2-nginx.sh

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate configuration and build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          VITE_AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          VITE_AZURE_API_SCOPE: ${{ vars.AZURE_API_SCOPE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$VITE_API_BASE_URL" =~ ^https://[a-z0-9-]+\.execute-api\.[a-z0-9-]+\.amazonaws\.com/?$ ]]; then
            echo "VITE_API_BASE_URL must be the HTTPS base URL of the deployed API Gateway." >&2
            exit 1
          fi
          for name in VITE_AZURE_CLIENT_ID VITE_AZURE_TENANT_ID VITE_AZURE_API_SCOPE \
            AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "Required GitHub secret/variable is missing: $name" >&2
              exit 1
            fi
          done
          npm install --legacy-peer-deps
          npm run build

      - name: Configure AWS Academy credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Recreate frontend infrastructure with temporary local state
        id: terraform
        working-directory: infra/terraform
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          terraform init -backend=false -input=false
          terraform plan -input=false -out=tfplan
          terraform show -json tfplan | jq -e '
            [.resource_changes[]?] as $changes |
            (all($changes[]; (.change.actions | index("delete")) == null and (.change.actions | index("update")) == null)) and
            all(["aws_instance.elegance_frontend_ec2", "aws_security_group.frontend_sg", "aws_key_pair.frontend_key"][];
              . as $address | any($changes[]; .address == $address and .change.actions == ["create"]))
          ' \
            >/dev/null
          bash scripts/cleanup-project-resources.sh
          terraform apply -input=false -auto-approve tfplan

          frontend_ip="$(terraform output -raw frontend_public_ip)"
          private_key_path="$RUNNER_TEMP/elegance_frontend.pem"
          terraform output -raw frontend_private_key_pem > "$private_key_path"
          chmod 600 "$private_key_path"

          {
            echo "frontend_ip=$frontend_ip"
            echo "private_key_path=$private_key_path"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Recreated frontend infrastructure"
            echo "- Frontend EC2 IP: \`$frontend_ip\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy SPA to recreated EC2
        env:
          FRONTEND_EC2_HOST: ${{ steps.terraform.outputs.frontend_ip }}
          PRIVATE_KEY_PATH: ${{ steps.terraform.outputs.private_key_path }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          install -m 600 "$PRIVATE_KEY_PATH" ~/.ssh/elegance_frontend
          SSH=(ssh -i ~/.ssh/elegance_frontend -o BatchMode=yes -o StrictHostKeyChecking=accept-new)
          SCP=(scp -i ~/.ssh/elegance_frontend -o BatchMode=yes -o StrictHostKeyChecking=accept-new)

          for attempt in {1..30}; do
            if "${SSH[@]}" "ec2-user@${FRONTEND_EC2_HOST}" true; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo "Frontend EC2 did not become reachable over SSH." >&2
              exit 1
            fi
            sleep 10
          done
          "${SCP[@]}" scripts/setup-ec2-nginx.sh \
            "ec2-user@${FRONTEND_EC2_HOST}:/tmp/setup-ec2-nginx.sh"
          "${SSH[@]}" "ec2-user@${FRONTEND_EC2_HOST}" \
            'sudo bash /tmp/setup-ec2-nginx.sh && rm -f /tmp/setup-ec2-nginx.sh'

          tar -czf /tmp/elegance-frontend-dist.tar.gz -C dist .
          "${SCP[@]}" /tmp/elegance-frontend-dist.tar.gz \
            "ec2-user@${FRONTEND_EC2_HOST}:/tmp/elegance-frontend-dist.tar.gz"
          "${SSH[@]}" "ec2-user@${FRONTEND_EC2_HOST}" '
            set -e
            mkdir -p /tmp/elegance-frontend-release
            sudo mkdir -p /var/www/salon-belleza
            tar -xzf /tmp/elegance-frontend-dist.tar.gz -C /tmp/elegance-frontend-release
            sudo cp -a /tmp/elegance-frontend-release/. /var/www/salon-belleza/
            sudo nginx -t
            sudo systemctl reload nginx
            rm -rf /tmp/elegance-frontend-release /tmp/elegance-frontend-dist.tar.gz
          '
