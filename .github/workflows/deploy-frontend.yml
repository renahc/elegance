name: Frontend validation and deployment
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish validated frontend to the configured EC2
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: /api/v1
          VITE_AZURE_CLIENT_ID: ${{ vars.VITE_AZURE_CLIENT_ID }}
          VITE_AZURE_AUTHORITY: ${{ vars.VITE_AZURE_AUTHORITY }}
          VITE_API_SCOPE: ${{ vars.VITE_API_SCOPE }}
          VITE_REDIRECT_URI: ${{ vars.VITE_REDIRECT_URI }}
      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: dist/
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: dist
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Publish built assets
        env:
          HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ vars.EC2_USER || 'ubuntu' }}
        run: rsync -az --delete dist/ "$SSH_USER@$HOST:/opt/elegance/public/"
